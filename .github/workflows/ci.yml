name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
      name: verify
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v6

        - uses: pnpm/action-setup@v6
          with:
            cache: true

        - uses: actions/setup-node@v6
          with:
            node-version: 22

        - run: pnpm install --frozen-lockfile

        - run: pnpm --filter @koru/api db:generate

        - run: pnpm lint
        - run: pnpm check-types
        - run: pnpm test:unit
        - run: pnpm build

  e2e:
      name: e2e
      runs-on: ubuntu-latest
      services:
        postgres:
          image: postgres:17
          env:
            POSTGRES_USER: koru
            POSTGRES_PASSWORD: koru
            POSTGRES_DB: koru_test
          ports:
            - 5432:5432
          options: >-
            --health-cmd "pg_isready -U koru -d koru_test"
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5
        redis:
          image: redis:7-alpine
          ports:
            - 6379:6379
          options: >-
            --health-cmd "redis-cli ping"
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5
      steps:
        - uses: actions/checkout@v6

        - uses: pnpm/action-setup@v6
          with:
            cache: true

        - uses: actions/setup-node@v6
          with:
            node-version: 22

        - run: pnpm install --frozen-lockfile
        - run: pnpm --filter @koru/api db:generate

        # @koru/shared resolves via its package.json exports to dist/, which is
        # gitignored and so absent on a fresh clone. Builds the dependencies of
        # @koru/api, not @koru/api itself (e2e compiles that from source).
        - run: pnpm --filter @koru/api^... build

        - name: Write .env.test
          run: cp apps/api/.env.test.example apps/api/.env.test

        - run: pnpm --filter @koru/api test:e2e
